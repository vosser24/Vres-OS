name: Vres-OS CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vres_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vres_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      PYTHONUTF8: "1"
      VRES_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vres_ci_test
      VRES_ALLOW_TEST_DB: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Provision exact offline build backend
        run: python -m pip install "setuptools==82.0.1" wheel

      - name: Install test runtime
        run: python -m pip install ".[full,dev]"

      - name: Repository-wide critical Python lint
        run: python -m ruff check src tests scripts --select E9,F63,F7,F82

      - name: Strict lint for authority replay executor and model evidence surfaces
        run: >-
          python -m ruff check
          src/vres_os/authority.py
          src/vres_os/company_mcp.py
          src/vres_os/procedures.py
          src/vres_os/replay.py
          src/vres_os/validation.py
          src/vres_os/executor.py
          src/vres_os/procedure_recipe.py
          src/vres_os/procedure_worker.py
          src/vres_os/processes.py
          src/vres_os/model_policy.py
          src/vres_os/model_experiments.py
          src/vres_os/claude_experiment.py
          tests/test_company_authority.py
          tests/test_company_optimization_mcp.py
          tests/test_replay_attestation.py
          tests/test_executor.py
          tests/test_procedure_recipe.py
          tests/test_model_policy_provenance.py
          tests/test_model_experiment_evidence.py
          tests/test_claude_experiment_producer.py
          tests/integration/test_company_authority_journey.py
          tests/integration/test_company_optimization_journey.py
          tests/integration/test_replay_attestation_journey.py
          tests/integration/test_bounded_executor_journey.py
          tests/integration/test_model_experiment_journey.py
          --ignore E501,I001

      - name: Full test suite with PostgreSQL integration
        run: python -m pytest -o addopts= -q -ra

      - name: Installed runtime import smoke
        run: >-
          python -c "import importlib.resources, vres_os.company_mcp as c, vres_os.replay as r,
          vres_os.executor as e, vres_os.procedure_worker as w, vres_os.model_policy as mp,
          vres_os.model_experiments as me, vres_os.statusline as sl;
          assert callable(c.main) and hasattr(r, 'ReplayService') and hasattr(e, 'ProcedureExecutorService') and callable(w.main);
          assert hasattr(mp, 'ModelPolicyService') and hasattr(me, 'ModelExperimentService') and callable(sl.render_statusline);
          assert len(list(importlib.resources.files('vres_os').joinpath('migrations').iterdir())) >= 14"

      - name: Local release gate
        run: |
          evidence="$RUNNER_TEMP/vres-release-gate"
          rm -rf "$evidence"
          python scripts/release_gate.py --output "$evidence"

      - name: Upload release-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-evidence
          path: ${{ runner.temp }}/vres-release-gate
          if-no-files-found: ignore
