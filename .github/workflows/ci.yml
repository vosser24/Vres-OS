name: Vres-OS CI

on:
  push:
    branches: [main, "work/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vres_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vres_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      PYTHONUTF8: "1"
      VRES_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vres_ci_test
      VRES_ALLOW_TEST_DB: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test runtime
        run: python -m pip install ".[full,dev]"

      - name: Repository-wide critical Python lint
        run: python -m ruff check src tests scripts --select E9,F63,F7,F82

      - name: Strict lint for new authority surface
        run: >-
          python -m ruff check
          src/vres_os/authority.py
          src/vres_os/company_mcp.py
          tests/test_company_authority.py
          tests/integration/test_company_authority_journey.py
          --ignore E501,I001

      - name: Full test suite with PostgreSQL integration
        run: python -m pytest -o addopts= -q -ra

      - name: Installed company MCP import smoke
        run: >-
          python -c "import importlib.resources, vres_os.company_mcp as c;
          assert callable(c.main);
          assert len(list(importlib.resources.files('vres_os').joinpath('migrations').iterdir())) >= 10"

      - name: Local release gate
        run: |
          evidence="$RUNNER_TEMP/vres-release-gate"
          rm -rf "$evidence"
          python scripts/release_gate.py --output "$evidence"

      - name: Upload release-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-evidence
          path: ${{ runner.temp }}/vres-release-gate
          if-no-files-found: ignore
