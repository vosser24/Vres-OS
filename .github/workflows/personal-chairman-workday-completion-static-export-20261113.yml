# Static-only Git archive export. Product modules never imported or executed.
name: Personal Chairman workday pinned source static-only export
on:
  push:
    branches: [feature/personal-chairman-workday-completion-static-export-20261113]
permissions:
  contents: read
jobs:
  static-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      VRES_ALLOW_TEST_DB: '0'
      VRES_TEST_DATABASE_URL: ''
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 3
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify exact source and produce static git archive
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feature/personal-chairman-workday-completion-static-export-20261113"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "a8a43ef47e4d54814b4ca11270fed3ca9b79d1c7"
          test "$(git rev-parse HEAD^^)" = "60a07eb623c5b7626d7284f8e6e3aaa3e83fafb0"
          test "$(git rev-parse HEAD^^^{tree})" = "356f0f4cf92b627ec3aebc8ee728a8afb7be0e6c"
          test "$(git rev-parse HEAD^{tree})" != "356f0f4cf92b627ec3aebc8ee728a8afb7be0e6c"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/personal-chairman-workday-completion-static-export-20261113.yml"
          test -z "$(git status --porcelain --untracked-files=all)"
          git archive --format=zip --output="$RUNNER_TEMP/vres-source-60a07eb.zip" HEAD^^
          python3 -I -S -B - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, os
          p = Path(os.environ['RUNNER_TEMP']) / 'vres-source-60a07eb.zip'
          expected = {
              'src/vres_os/personal_work_session.py': '1d8ac9c6b563c5fe695c7ad16279af355897ac61',
              'src/vres_os/personal_desk_cli.py': 'f989fa569f6bd7aa01d472240a8d0f8e539bc8a5',
              'tests/test_personal_result_completion_history.py': '68ab8a47ffa24b2ee34141311b4ae3e8d541f13a',
          }
          with ZipFile(p) as z:
              names = set(z.namelist())
              assert len(names) >= 550
              for name, wanted in expected.items():
                  payload = z.read(name)
                  git_sha = hashlib.sha1(b'blob ' + str(len(payload)).encode('ascii') + b'\0' + payload).hexdigest()
                  assert git_sha == wanted, name
          print('STATIC_ONLY_SOURCE_PASS', hashlib.sha256(p.read_bytes()).hexdigest())
          print('NO_PRODUCT_IMPORT_NO_DB_NO_NATIVE')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vres-pinned-chairman-workday-60a07eb
          path: ${{ runner.temp }}/vres-source-60a07eb.zip
          retention-days: 1
          if-no-files-found: error
